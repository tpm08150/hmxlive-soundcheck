[build]
  publish = "."
  functions = "netlify/functions"

# The game is index.html, so the bare domain serves it. If anyone bookmarked
# the old filename, send them to the root instead of a 404.
[[redirects]]
  from = "/hmxlive-soundcheck.html"
  to = "/"
  status = 301
  force = true

# The function declares its own route via `export const config = { path: '/api/scores' }`,
# so no redirect is needed for the API.

[[headers]]
  for = "/api/scores"
  [headers.values]
    Cache-Control = "no-store"
